<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertar nombre y apellido</title>
</head>
<body>
    <h1>Insertar datos</h1>
    <script>
        let nombre = prompt('Introduzca su nombre', 'Nombre...');
        let apellidos = prompt('Introduzca sus apellidos', 'Apellidos...');
        confirm('Es usted: ' + nombre + ' ' + apellidos + '?');
    </script>
</body>
</html>
