<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir cerrar ventana</title>



    <!-- Esto solo funciona el sitios no oficiales. No se puede usar con youtube, solo la direccion de sitios a los que nosotros tengamos permmiso -->
    <script type="text/javaScript">
        var nuevaVentana = null;

        function AbrirVentana() {
            nuevaVentana = window.open("mostrarMensaje.html", "nueva", "width = 100,  height = 100")
        }

        function CerrarVentana() {
            if (nuevaVentana != null) {
                nuevaVentana.close();
                nuevaVentana = null;
            }
        }
    </script>
</head>
<body>
    <form>
        <input type="button" value="Abrir ventana" onclick="AbrirVentana()">
        <input type="button" value="Cerrar ventana" onclick="CerrarVentana()">
    </form>
</body>
</html>
